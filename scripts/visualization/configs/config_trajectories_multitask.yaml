defaults:
  - world_model@datasets.pusht_train.world_model: lewm
  - world_model@datasets.tworoom_train.world_model: lewm
  - world_model@datasets.cube_train.world_model: lewm
  - _self_ # Overrides from this file apply LAST

# Joint cross-task trajectory visualization: pool expert trajectories from
# every task, encode each with the SAME multitask model's per-task export
# (task-conditioned rollout), and project truth+prediction jointly.
# Per-run CLI overrides set the three world_model.model_name checkpoint paths.

device: cpu
seed: 42
image_size: 224
patch_size: 14
frameskip: 5
cache_dir: null
dimensionality_reduction: tsne

datasets:
  pusht_train:
    dataset:
      dataset_name: galilai-group--lewm-pusht
      batch_size: 32
      num_workers: 8
      n_trajectories: 4
      n_steps: ${eval:'${..world_model.num_preds} + ${..world_model.history_size}'}
    dataset_group: pusht
  tworoom_train:
    dataset:
      dataset_name: quentinll--lewm-tworooms/tworoom.h5
      batch_size: 32
      num_workers: 8
      n_trajectories: 4
      n_steps: ${eval:'${..world_model.num_preds} + ${..world_model.history_size}'}
    dataset_group: tworoom
  cube_train:
    dataset:
      dataset_name: quentinll--lewm-cube/cube_single_expert.h5
      batch_size: 32
      num_workers: 8
      n_trajectories: 4
      n_steps: ${eval:'${..world_model.num_preds} + ${..world_model.history_size}'}
    dataset_group: cube
