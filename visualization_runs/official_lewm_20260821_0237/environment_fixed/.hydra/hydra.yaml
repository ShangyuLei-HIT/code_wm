hydra:
  run:
    dir: /vepfs-mlp2/c20250203/400120/stable-worldmodel/visualization_runs/official_lewm_20260821_0237/environment_fixed
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/vepfs-mlp2/c20250203/400120/stable-worldmodel/visualization_runs/official_lewm_20260821_0237/environment_fixed
    - hydra.job.chdir=true
    - hydra.mode=RUN
    task:
    - ~datasets.two_room
    - ~datasets.ogbench_cube
    - +datasets.pusht.world_model.checkpoint_path=/vepfs-mlp2/c20250203/400120/stable-worldmodel/.stablewm/checkpoints/official_lewm_pusht_compat
    - datasets.pusht.world_model.encoding={}
  job:
    name: visualize_env
    chdir: true
    override_dirname: +datasets.pusht.world_model.checkpoint_path=/vepfs-mlp2/c20250203/400120/stable-worldmodel/.stablewm/checkpoints/official_lewm_pusht_compat,datasets.pusht.world_model.encoding={},~datasets.ogbench_cube,~datasets.two_room
    id: ???
    num: ???
    config_name: config_envs
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.5
    version_base: '1.3'
    cwd: /vepfs-mlp2/c20250203/400120/stable-worldmodel
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /vepfs-mlp2/c20250203/400120/stable-worldmodel/scripts/visualization/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /vepfs-mlp2/c20250203/400120/stable-worldmodel/visualization_runs/official_lewm_20260821_0237/environment_fixed
    choices:
      world_model@datasets.ogbench_cube.world_model: prejepa_action_only
      world_model/backbone@datasets.ogbench_cube.world_model.backbone: dinov3_small
      world_model@datasets.pusht.world_model: prejepa
      world_model/backbone@datasets.pusht.world_model.backbone: dinov3_small
      world_model@datasets.two_room.world_model: prejepa
      world_model/backbone@datasets.two_room.world_model.backbone: dinov3_small
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
